{% extends "admin/base_site.html" %}

{% block breadcrumbs %}
<div class="breadcrumbs">
    <a href="{{ changelist_url }}">Заявки на ремонт</a>
    &rsaquo; {{ title }}
</div>
{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<p>
    Заявка №{{ ticket.pk }}: <strong>{{ ticket.title }}</strong>
</p>
<p>Текущий статус: {{ ticket.get_status_display }}</p>

<form method="post">
    {% csrf_token %}

    <input
        type="hidden"
        name="action"
        value="{{ action_name }}"
    >
    <input
        type="hidden"
        name="{{ action_checkbox_name }}"
        value="{{ ticket.pk }}"
    >
    <input type="hidden" name="select_across" value="0">
    <input type="hidden" name="confirm_status" value="1">

    {{ form.as_p }}

    <div class="submit-row">
        <button type="submit">Подтвердить</button>
        <a href="{{ changelist_url }}">Отмена</a>
    </div>
</form>
{% endblock %}
